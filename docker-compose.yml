services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
      image: confluentinc/cp-kafka:7.6.1
      hostname: kafka
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        # Define two listeners: one for internal Docker traffic, one for your Windows host
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,OUTSIDE:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      depends_on:
        - zookeeper


  jobmanager:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - .:/opt/flink/usertools
      # Consistent pathing for the key
      - ./gcp-key.json:/opt/flink/usertools/gcp-key.json:ro
    command: jobmanager
    environment:
      - PYFLINK_CLIENT_EXECUTABLE=python3
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

  taskmanager:
    build: .
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - PYFLINK_CLIENT_EXECUTABLE=python3
      - JAVA_TOOL_OPTIONS=-Dorg.conscrypt.native.enabled=false 
      - LD_PRELOAD=/lib/x86_64-linux-gnu/libc.so.6
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        flink.netty.ssl.provider: JDK
        # 1. Define the total envelope to prevent the "exceed total memory" crash
        taskmanager.memory.process.size: 5000m
        taskmanager.memory.task.off-heap.size: 512mb
        python.fn-execution.memory.managed: true
        taskmanager.memory.managed.size: 2048mb
    volumes:
      # CRITICAL: TaskManager MUST have access to the key as well
      - .:/opt/flink/usertools
      - ./gcp-key.json:/opt/flink/usertools/gcp-key.json:ro